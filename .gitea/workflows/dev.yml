name: Frontend Dev Auto Deploy

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.gitea/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install Git & Docker CLI
        run: |
          apk add --no-cache git docker-cli

      - name: Deploy Frontend
        run: |
          cd /srv/dev/frontend

          git fetch origin
          git reset --hard origin/dev

          cd /srv/dev/compose

          docker compose up -d --build frontend