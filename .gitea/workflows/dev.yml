name: Frontend Dev Auto Deploy

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.gitea/workflows/**'

jobs:
  deploy:
    # Tetap gunakan label default yang dikenali oleh runner Anda
    runs-on: ubuntu-latest
    
    # Trik: Paksa langkah di bawah dijalankan di dalam container Alpine
    container:
      image: node:22-alpine

    steps:
      # Langkah sisanya tetap sama persis seperti Solusi 1
      - name: Install OpenSSH Client
        run: |
          apk add --no-cache openssh-client

      - name: Deploy Frontend via Native SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
          
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            echo "=== FRONTEND DEPLOY START ==="
            cd /srv/dev/frontend
            git fetch origin
            git reset --hard origin/dev
            cd /srv/dev/compose
            docker compose up -d --build frontend
            echo "=== FRONTEND DEPLOY DONE ==="
          EOF
