name: Frontend Dev Auto Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Frontend Deploy
        run: |
          set -e

          echo "=== FRONTEND AUTO DEPLOY ==="

          cd /srv/dev/frontend

          echo "=== CURRENT BRANCH ==="
          git branch

          echo "=== FETCH LATEST ==="
          git fetch origin

          echo "=== RESET TO ORIGIN/DEV ==="
          git reset --hard origin/dev

          echo "=== BUILD & RESTART FRONTEND ==="
          cd /srv/dev/compose

          docker compose up -d --build frontend

          echo "=== FRONTEND DEPLOY SUCCESS ==="