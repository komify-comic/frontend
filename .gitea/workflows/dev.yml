name: Frontend Dev Auto Deploy

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.gitea/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend
        run: |
          set -e

          echo "=== FRONTEND DEPLOY START ==="

          cd /srv/dev/frontend

          git fetch origin
          git reset --hard origin/dev

          cd /srv/dev/compose

          docker compose up -d --build frontend

          echo "=== FRONTEND DEPLOY DONE ==="