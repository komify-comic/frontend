name: Frontend Dev Auto Deploy

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.gitea/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend via SSH
        uses: gitea/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== FRONTEND DEPLOY START ==="
            
            cd /srv/dev/frontend
            git fetch origin
            git reset --hard origin/dev
            
            cd /srv/dev/compose
            docker compose up -d --build frontend
            
            echo "=== FRONTEND DEPLOY DONE ==="
